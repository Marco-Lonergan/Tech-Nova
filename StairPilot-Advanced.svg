<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="title description">
  <title id="title">Advanced powered wheelchair concept</title>
  <desc id="description">A person using a modern blue powered wheelchair with supportive seating, a joystick controller, large drive wheels, and sensor details in a bright everyday setting.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf4ff"/>
      <stop offset="1" stop-color="#d8e6f4"/>
    </linearGradient>
    <linearGradient id="chair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36c8ed"/>
      <stop offset="1" stop-color="#1763c7"/>
    </linearGradient>
    <linearGradient id="seat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35445c"/>
      <stop offset="1" stop-color="#17243a"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="12"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="640" fill="url(#background)"/>
  <circle cx="750" cy="112" r="52" fill="#fff" opacity=".55"/>
  <path d="M0 450 250 260l180 190 185-220 285 220v190H0Z" fill="#fff" opacity=".35"/>
  <path d="M0 520h900v120H0z" fill="#d2dfeb"/>
  <path d="M0 538h900" stroke="#fff" stroke-width="5" opacity=".7"/>
  <ellipse cx="474" cy="533" rx="270" ry="31" fill="#647b96" opacity=".2"/>

  <g filter="url(#shadow)">
    <!-- Rear support and seat -->
    <path d="M351 292 326 171q-5-25 19-30l25-4q22-3 27 21l24 127" fill="url(#seat)" stroke="#19273b" stroke-width="10" stroke-linejoin="round"/>
    <path d="m344 171 30-7 17 92-29 8z" fill="#53647b" opacity=".65"/>
    <path d="M352 301q4-18 25-18h151q24 0 27 22l-5 25H361z" fill="url(#seat)"/>
    <path d="M371 304h153" stroke="#61dcf4" stroke-width="5" stroke-linecap="round"/>

    <!-- Person -->
    <path d="M399 142q-2-42 33-49 37-6 50 29 10 29-8 53-18 20-45 8-25-10-30-41z" fill="#c98762"/>
    <path d="M395 138q-3-50 38-59 35-8 53 24-25-9-44 3-13 9-17 29-13 12-30 3z" fill="#263346"/>
    <path d="M400 186q-4-16 12-23l24-8q18 5 35 19l37 99q-5 23-25 29l-88-9q-19-9-17-31z" fill="#28374d"/>
    <path d="m459 191 48 78 71 8q18 4 15 19-3 13-21 12l-81-6q-15-2-23-15l-38-58" fill="#c98762" stroke="#b87553" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m405 288 84 8 52 96q3 19-15 24l-31 6q-20 1-27-16l-60-69-27-20z" fill="#263346"/>
    <path d="m484 402 43 2 24 20q4 13-10 18l-71-2q-15-5-9-18z" fill="#25354b"/>
    <path d="m516 404 28 9 18 19" fill="none" stroke="#1b2b41" stroke-width="12" stroke-linecap="round"/>

    <!-- Chair frame and drive wheel -->
    <path d="m351 332 48 24 5 105" fill="none" stroke="#26364c" stroke-width="16" stroke-linecap="round"/>
    <path d="m384 337 111 8 56 93" fill="none" stroke="url(#chair)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="414" cy="440" r="87" fill="#18263c" stroke="#0f1d31" stroke-width="8"/>
    <circle cx="414" cy="440" r="68" fill="#263a56" stroke="url(#chair)" stroke-width="12"/>
    <circle cx="414" cy="440" r="45" fill="#16253b" stroke="#54718f" stroke-width="4"/>
    <circle cx="414" cy="440" r="17" fill="#38c9ec"/>
    <path d="M414 393v28m0 38v28m-47-47h28m38 0h28m-80-33 20 20m27 27 20 20m0-67-20 20m-27 27-20 20" stroke="#6b849f" stroke-width="4" opacity=".75"/>
    <path d="m401 353-7 44" stroke="#91efff" stroke-width="6" stroke-linecap="round"/>

    <!-- Base, foot support, and front caster -->
    <path d="m496 469 93-30 53 18q14 6 8 20l-16 26q-7 11-22 8l-113-20z" fill="url(#chair)" stroke="#174c96" stroke-width="6"/>
    <path d="m536 489 30 3 21 24q3 11-10 14h-76q-15-4-9-17z" fill="#25364d"/>
    <path d="m634 474 20 5 12 21" fill="none" stroke="#24354c" stroke-width="9" stroke-linecap="round"/>
    <circle cx="665" cy="511" r="18" fill="#25364c"/>
    <circle cx="665" cy="511" r="8" fill="#83dff3"/>
    <path d="m529 454 91-25" stroke="#85eaff" stroke-width="5" stroke-linecap="round"/>

    <!-- Armrest and joystick -->
    <path d="m382 293 7 28 71 3 5-28" fill="none" stroke="#27374e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m446 319 0-19" stroke="#1c2d44" stroke-width="7" stroke-linecap="round"/>
    <circle cx="446" cy="296" r="8" fill="#50d4f1" stroke="#fff" stroke-width="3"/>

    <!-- Small sensor accents -->
    <rect x="534" y="426" width="31" height="13" rx="6.5" fill="#14253a"/>
    <circle cx="544" cy="432.5" r="3" fill="#63e6ff"/>
    <circle cx="555" cy="432.5" r="3" fill="#63e6ff"/>
    <path d="M568 411q18-10 33 0m-28 9q13-7 23 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".85"/>
  </g>

  <!-- Everyday-use feature badges -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(52 72)">
      <rect width="188" height="58" rx="18" fill="#fff" opacity=".88"/>
      <circle cx="30" cy="29" r="17" fill="#e5f7fb"/>
      <path d="M24 29h12m-6-6v12" stroke="#1885bc" stroke-width="3" stroke-linecap="round"/>
      <text x="58" y="25" fill="#25364d" font-size="14" font-weight="700">Everyday</text>
      <text x="58" y="43" fill="#667790" font-size="12">powered mobility</text>
    </g>
    <g transform="translate(650 330)">
      <rect width="198" height="58" rx="18" fill="#fff" opacity=".9"/>
      <circle cx="30" cy="29" r="17" fill="#e5f7fb"/>
      <path d="M22 30h16m-8-8v16" stroke="#1885bc" stroke-width="3" stroke-linecap="round"/>
      <text x="58" y="25" fill="#25364d" font-size="14" font-weight="700">User-focused</text>
      <text x="58" y="43" fill="#667790" font-size="12">support &amp; controls</text>
    </g>
  </g>
</svg>
